[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricsvideo"
version = "0.1.0"
description = "Render lyrics videos from audio + timed .lrc lyrics using ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
lyricsvideo = "lyricsvideo.cli:main"

[tool.setuptools]
packages = ["lyricsvideo"]
